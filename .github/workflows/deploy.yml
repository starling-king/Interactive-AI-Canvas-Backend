name: Production Deployment Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. THE ARCHITECTURE FIREWALL (Install & Test)
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      - name: Trick Node with Empty Env File
        run: touch .env

      - name: Run Security & Architecture Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: "3d"
          REFRESH_TOKEN_EXPIRY: "10d"
          CORS_ORIGIN: "*"
        run: npm run test

      # ---------------------------------------------------------
      # 2. DOCKER BUILD & PUSH (Only runs if tests pass 100%)
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-canvas-api:latest

      # ---------------------------------------------------------
      # 3. PRODUCTION DEPLOYMENT
      # ---------------------------------------------------------
      - name: Trigger Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}